# docker compose up  →  working service from nothing.
#
# Service names are api/postgres/redis; container names are dwaar-*. The demo timeline
# targets containers by name (`dwaar-llm-explainer`, `dwaar-ledger`), so the names are
# pinned rather than left to Compose's project-prefixed default.
#
# NOTE on the demo's `dwaar-ledger` kill target: the ledger IS Postgres. The container is
# named dwaar-postgres here because that is what it is, and calling it "the ledger" on
# stage while the container says "postgres" invites a question with a worse answer than
# the truth. Recorded in FAILURES.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: dwaar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_pw}
      POSTGRES_DB: ${POSTGRES_DB:-dwaar}
      DWAAR_OWNER_PASSWORD: ${DWAAR_OWNER_PASSWORD:-owner_pw}
      DWAAR_APP_PASSWORD: ${DWAAR_APP_PASSWORD:-app_pw}
    volumes:
      # Runs once, as superuser, on an empty data directory. Creates the two roles.
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dwaar}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: dwaar-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    container_name: dwaar-api
    environment:
      DATABASE_URL_MIGRATE: postgresql://dwaar_owner:${DWAAR_OWNER_PASSWORD:-owner_pw}@postgres:5432/${POSTGRES_DB:-dwaar}
      DATABASE_URL_APP: postgresql://dwaar_app:${DWAAR_APP_PASSWORD:-app_pw}@postgres:5432/${POSTGRES_DB:-dwaar}
      DATABASE_URL_SUPERUSER: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_pw}@postgres:5432/${POSTGRES_DB:-dwaar}
      REDIS_URL: redis://redis:6379/0
      DWAAR_ENV: ${DWAAR_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
