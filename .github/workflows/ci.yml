name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_pw
          POSTGRES_DB: dwaar
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 3s --health-retries 30

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 30

    env:
      DATABASE_URL_MIGRATE: postgresql://dwaar_owner:owner_pw@localhost:5432/dwaar
      DATABASE_URL_APP: postgresql://dwaar_app:app_pw@localhost:5432/dwaar
      DATABASE_URL_SUPERUSER: postgresql://postgres:postgres_pw@localhost:5432/dwaar
      REDIS_URL: redis://localhost:6379/0
      PGPASSWORD: postgres_pw

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - name: Create roles (mirrors scripts/init-db/01-roles.sh)
        run: ./scripts/init-db/local-bootstrap.sh postgres dwaar

      - run: python -m ruff check dwaar tests scripts zoo tools eval

      # The DB suite must NOT be allowed to skip in CI. A skipped append-only test is
      # indistinguishable from an absent control, and that is the whole point of the repo.
      - name: Test (no skips permitted)
        run: python -m pytest -q -p no:cacheprovider -W error::UserWarning
      - name: Assert the database suite actually ran
        run: |
          python -m pytest -q -p no:cacheprovider -m db --collect-only \
            | tail -1 | grep -qE '[0-9]+ tests? collected'
          python -m pytest -p no:cacheprovider -m db -q 2>&1 | tee /tmp/db.txt
          grep -q "skipped" /tmp/db.txt && { echo "DB tests skipped in CI — refusing"; exit 1; } || true

      # The latency gate runs in CI from day 3, not day 12. Discovering 300ms on day 11 is
      # how this project dies: by then the pipeline has eight stages and nobody knows which
      # one did it.
      - name: Latency gates
        run: python -m pytest -q -p no:cacheprovider -s tests/db/test_authorize_latency.py

      # Rule 1, all three enforcements. Named explicitly so a failure here is unmistakable
      # rather than one line in a 537-test summary.
      - name: Rule 1 — no LLM in the hot path
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_hot_path_purity.py \
            tests/test_no_llm_in_hot_path.py

      - name: Rule 3 — zoo is not importable from dwaar
        run: python -m pytest -q -p no:cacheprovider tests/test_import_isolation.py

      - name: Rule 3 positive controls — the guards can actually fail
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_absence_controls.py \
            tests/crypto/test_integrity.py

      - name: Independent verifier — tamper any column, on any signed table
        run: python -m pytest -q -p no:cacheprovider tests/db/test_verify_cli.py

      - name: RFC 9421 — known-answer vectors and the signature stage
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/crypto/test_http_sig.py \
            tests/db/test_signature_stage.py

      - name: Policy engine — deterministic, and policy beats the model
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/policy/ tests/db/test_policy_lifecycle.py

      - name: Console builds
        run: cd console && npm ci && npm run build

      - name: Demo beat 2 — arithmetic deny, model never consulted
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/db/test_authorize_pipeline.py -k beat_2

      # `make verify` has now caught two defects the test suite missed — F-018's third
      # instance (a fixture writing a column instead of re-signing the row) and F-042 — both
      # with the suite green. That makes it load-bearing, and load-bearing things do not
      # depend on somebody remembering to run them.
      #
      # It runs AFTER the suite, over whatever the suite committed, so it verifies real
      # records rather than an empty table.
      - name: make verify — the independent verifier, over what the suite just wrote
        run: make verify

      # A verifier with nothing to verify prints the same PASS as one that checked
      # everything. That is F-014's exact failure mode, in the one tool whose entire value
      # is that its report can be believed — so the COUNT is asserted, not just the verdict.
      - name: Assert the verifier actually checked something
        run: |
          python -m dwaar.verify_cli --json > /tmp/verify.json
          python - <<'PY'
          import json, sys
          report = json.load(open("/tmp/verify.json"))
          checked = report["checked"]
          if not report["ok"]:
              print("verification FAILED:", *report["failures"], sep="\n  ")
              sys.exit(1)
          for name in ("decision_records.chain", "decision_records.columns",
                       "decision_records.amount"):
              if checked.get(name, 0) < 1:
                  print(f"{name} checked {checked.get(name, 0)} rows — a PASS over nothing")
                  sys.exit(1)
          print("verified:", checked)
          PY

      - name: make demo — every beat, against the running gateway
        run: |
          python -m scripts.seed_db
          nohup python -m uvicorn dwaar.api.app:app --port 8080 --log-level warning &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/health >/dev/null && break; sleep 1; done
          # --no-kill: there are no containers in this job to kill. The beats that CAN be
          # asserted here are the six that make a decision, and every expectation in the
          # timeline is checked against what the API returned.
          make demo DEMO_ARGS="--fast --no-kill"
          make demo-restore

      # The stub guard, reduced to what is still a stub. All three targets exited 2 until
      # the thing behind them existed; `make demo` was the last, and there is nothing left
      # for this loop to protect. Kept as an empty list rather than deleted, so the next
      # stub added has an obvious home.
      - name: No target may exit 0 while its implementation is a stub
        run: |
          for t in ; do
            if make $t >/dev/null 2>&1; then
              echo "make $t exited 0 but is not implemented — a green stub is a false claim"
              exit 1
            fi
          done
