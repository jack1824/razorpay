name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_pw
          POSTGRES_DB: dwaar
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 3s --health-retries 30

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 30

    env:
      DATABASE_URL_MIGRATE: postgresql://dwaar_owner:owner_pw@localhost:5432/dwaar
      DATABASE_URL_APP: postgresql://dwaar_app:app_pw@localhost:5432/dwaar
      DATABASE_URL_SUPERUSER: postgresql://postgres:postgres_pw@localhost:5432/dwaar
      REDIS_URL: redis://localhost:6379/0
      PGPASSWORD: postgres_pw

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - name: Create roles (mirrors scripts/init-db/01-roles.sh)
        run: ./scripts/init-db/local-bootstrap.sh postgres dwaar

      - run: python -m ruff check dwaar tests scripts

      # The DB suite must NOT be allowed to skip in CI. A skipped append-only test is
      # indistinguishable from an absent control, and that is the whole point of the repo.
      - name: Test (no skips permitted)
        run: python -m pytest -q -p no:cacheprovider -W error::UserWarning
      - name: Assert the database suite actually ran
        run: |
          python -m pytest -q -p no:cacheprovider -m db --collect-only \
            | tail -1 | grep -qE '[0-9]+ tests? collected'
          python -m pytest -p no:cacheprovider -m db -q 2>&1 | tee /tmp/db.txt
          grep -q "skipped" /tmp/db.txt && { echo "DB tests skipped in CI — refusing"; exit 1; } || true

      # The latency gate runs in CI from day 3, not day 12. Discovering 300ms on day 11 is
      # how this project dies: by then the pipeline has eight stages and nobody knows which
      # one did it.
      - name: Latency gates
        run: python -m pytest -q -p no:cacheprovider -s tests/db/test_authorize_latency.py

      # Rule 1, all three enforcements. Named explicitly so a failure here is unmistakable
      # rather than one line in a 537-test summary.
      - name: Rule 1 — no LLM in the hot path
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_hot_path_purity.py \
            tests/test_no_llm_in_hot_path.py

      - name: Rule 3 — zoo is not importable from dwaar
        run: python -m pytest -q -p no:cacheprovider tests/test_import_isolation.py

      - name: Rule 3 positive controls — the guards can actually fail
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_absence_controls.py \
            tests/crypto/test_integrity.py

      - name: Independent verifier — tamper any column, on any signed table
        run: python -m pytest -q -p no:cacheprovider tests/db/test_verify_cli.py

      - name: RFC 9421 — known-answer vectors and the signature stage
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/crypto/test_http_sig.py \
            tests/db/test_signature_stage.py

      - name: Demo beat 2 — arithmetic deny, model never consulted
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/db/test_authorize_pipeline.py -k beat_2

      - name: make verify/eval/demo must exit non-zero until implemented
        run: |
          for t in verify eval demo; do
            if make $t >/dev/null 2>&1; then
              echo "make $t exited 0 but is not implemented — a green stub is a false claim"
              exit 1
            fi
          done
