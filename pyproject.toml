[project]
name = "dwaar"
version = "0.1.0"
description = "Authorization and policy enforcement for AI agents that spend money."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "structlog>=24.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "cryptography>=43.0",
    # Risk scoring, request path. INFERENCE ONLY — see dwaar/risk/model.py. LightGBM,
    # scikit-learn and the ONNX converters are training dependencies and live in the
    # `train` extra, kept off the request path and asserted by tests/test_hot_path_purity.py.
    "numpy>=2.0",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.7",
]

# Offline only. `tools/train_risk.py` and nothing else. Installing these is not required to
# run the gateway, which loads a pre-built ONNX bundle from `models/risk/`.
#
# On macOS, LightGBM needs OpenMP at runtime: `brew install libomp`. Linux wheels bundle it.
train = [
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "onnx>=1.17",
    "onnxmltools>=1.12",
    "skl2onnx>=1.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dwaar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:dwaar.*"]
markers = [
    "db: requires a live PostgreSQL (skipped when DATABASE_URL_MIGRATE is unset)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
